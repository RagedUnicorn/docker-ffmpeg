schemaVersion: 2.0.0

commandTests:
  - name: 'FFmpeg version check'
    command: 'ffmpeg'
    args: ['-version']
    expectedOutput:
      - 'ffmpeg version 7.1.5'
      - 'libavutil'
      - 'libavcodec'
      - 'libavformat'
    exitCode: 0

  - name: 'FFprobe version check'
    command: 'ffprobe'
    args: ['-version']
    expectedOutput:
      - 'ffprobe version 7.1.5'
    exitCode: 0

  - name: 'List video encoders'
    command: 'ffmpeg'
    args: ['-encoders']
    expectedOutput:
      - 'libx264'
      - 'libx265'
      - 'libvpx'
      - 'libvpx-vp9'
      - 'libtheora'
      - 'libaom-av1'
      - 'libsvtav1'
    exitCode: 0

  - name: 'Check AV1 decoder is present'
    command: 'ffmpeg'
    args: ['-decoders']
    expectedOutput:
      - 'libdav1d'
    exitCode: 0

  - name: 'Check AV1 libraries are enabled'
    command: 'ffmpeg'
    args: ['-buildconf']
    expectedOutput:
      - 'enable-libaom'
      - 'enable-libsvtav1'
      - 'enable-libdav1d'
    exitCode: 0

  # AVIF is AV1 in a HEIF container, so this is the use case that first exposed
  # the missing encoder. libaom is the encoder that supports still-picture mode
  - name: 'Encode a still image to AVIF'
    command: 'sh'
    args:
      - '-c'
      - 'ffmpeg -y -loglevel error -f lavfi -i color=c=red:s=64x64 -frames:v 1 -c:v libaom-av1 -still-picture 1 /tmp/workdir/still.avif && ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/workdir/still.avif'
    expectedOutput:
      - 'av1'
    exitCode: 0

  # Round trip through the two remaining AV1 libraries: encode with SVT-AV1 and
  # decode the result with dav1d. 320x240 stays above SVT-AV1's minimum
  # dimensions and preset 12 keeps the encode fast
  - name: 'Encode AV1 video with SVT-AV1 and decode it with dav1d'
    command: 'sh'
    args:
      - '-c'
      - 'ffmpeg -y -loglevel error -f lavfi -i testsrc=size=320x240:rate=10 -frames:v 10 -c:v libsvtav1 -preset 12 /tmp/workdir/av1.mkv && ffmpeg -v error -c:v libdav1d -i /tmp/workdir/av1.mkv -f null - && echo decoded-ok'
    expectedOutput:
      - 'decoded-ok'
    exitCode: 0

  - name: 'List audio encoders'
    command: 'ffmpeg'
    args: ['-encoders']
    expectedOutput:
      - 'libmp3lame'
      - 'libopus'
      - 'libvorbis'
      - 'libfdk_aac'
    exitCode: 0

  - name: 'Check OpenSSL support'
    command: 'ffmpeg'
    args: ['-protocols']
    expectedOutput:
      - 'https'
      - 'tls'
    exitCode: 0

  - name: 'Check RTMP support'
    command: 'ffmpeg'
    args: ['-protocols']
    expectedOutput:
      - 'rtmp'
      - 'rtmps'
    exitCode: 0

  - name: 'Check filter support'
    command: 'ffmpeg'
    args: ['-filters']
    expectedOutput:
      - 'scale'
      - 'overlay'
      - 'ass'
      - 'subtitles'
    exitCode: 0

  # drawtext needs libfreetype, libharfbuzz and libfontconfig together since
  # FFmpeg 7. With freetype alone the build still succeeds and -buildconf still
  # advertises --enable-libfreetype, but configure drops the filter, so the only
  # symptom is "No such filter: 'drawtext'" at run time
  - name: 'Check drawtext filter is present'
    command: 'ffmpeg'
    args: ['-filters']
    expectedOutput:
      - 'drawtext'
    exitCode: 0

  - name: 'Check text rendering libraries are enabled'
    command: 'ffmpeg'
    args: ['-buildconf']
    expectedOutput:
      - 'enable-libfreetype'
      - 'enable-libharfbuzz'
      - 'enable-libfontconfig'
    exitCode: 0

  # The functional proof. A filter can be listed and still fail at run time when
  # the image has no font file, and drawtext resolves its default font=Sans
  # through fontconfig, so this covers the font package as well as the filter
  - name: 'Render text into a frame'
    command: 'sh'
    args:
      - '-c'
      - 'ffmpeg -y -loglevel error -f lavfi -i color=c=white:s=320x80 -vf "drawtext=text=RagedUnicorn:fontcolor=black:fontsize=24:x=10:y=10" -frames:v 1 /tmp/workdir/drawtext.png && ffprobe -v error -show_entries stream=width,height -of csv=p=0 /tmp/workdir/drawtext.png'
    expectedOutput:
      - '320,80'
    exitCode: 0

  - name: 'Test simple conversion command'
    setup: [['sh', '-c', 'echo "test" > /tmp/workdir/test.txt']]
    command: 'sh'
    args: ['-c', 'cd /tmp/workdir && ls']
    expectedOutput: ['test.txt']
    exitCode: 0

  - name: 'Non-root user exists'
    command: 'id'
    args: ['ffmpeg']
    exitCode: 0
    expectedOutput:
      - 'uid='
      - 'ffmpeg'
