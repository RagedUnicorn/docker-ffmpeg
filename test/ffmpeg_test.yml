schemaVersion: 2.0.0

fileExistenceTests:
  - name: 'FFmpeg binary exists'
    path: '/usr/local/bin/ffmpeg'
    shouldExist: true
    permissions: '-rwxr-xr-x'

  - name: 'FFprobe binary exists'
    path: '/usr/local/bin/ffprobe'
    shouldExist: true
    permissions: '-rwxr-xr-x'

  - name: 'Working directory exists'
    path: '/tmp/workdir'
    shouldExist: true
    isExecutableBy: 'any'

fileContentTests:
  - name: 'CA certificates installed'
    path: '/etc/ssl/certs/ca-certificates.crt'
    expectedContents: ['-----BEGIN CERTIFICATE-----']

# Core shared libraries are checked via globs rather than hardcoded paths:
# Alpine ships versioned .so files (e.g. libx265.so.215) whose SONAME changes
# on Alpine bumps, so an exact path would break on every update. The functional
# encoder coverage lives in ffmpeg_command_test.yml; these checks just confirm
# the runtime libraries are physically present.
commandTests:
  - name: 'libx264 shared library present'
    command: 'sh'
    args: ['-c', 'ls /usr/lib/libx264.so.*']
    exitCode: 0

  - name: 'libx265 shared library present'
    command: 'sh'
    args: ['-c', 'ls /usr/lib/libx265.so.*']
    exitCode: 0

  - name: 'libvpx shared library present'
    command: 'sh'
    args: ['-c', 'ls /usr/lib/libvpx.so.*']
    exitCode: 0

  - name: 'libopus shared library present'
    command: 'sh'
    args: ['-c', 'ls /usr/lib/libopus.so.*']
    exitCode: 0

  - name: 'libmp3lame shared library present'
    command: 'sh'
    args: ['-c', 'ls /usr/lib/libmp3lame.so.*']
    exitCode: 0
