name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ragedunicorn/ffmpeg:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Container Structure Tests
        env:
          FFMPEG_TEST_VERSION: test
        run: |
          echo "::notice title=🧪 Running Tests::Validating Docker image before release..."
          docker compose -f docker-compose.test.yml pull
          
          echo "::group::Running all Container Structure Tests"
          docker compose -f docker-compose.test.yml run --rm test-all
          echo "::endgroup::"
          
          echo "::notice title=✅ Tests Passed::All Container Structure Tests completed successfully!"

  # Build each platform natively on its own runner (FFmpeg is compiled from
  # source, so building arm64 under QEMU is far too slow), smoke test the loaded
  # image, and only then push it to GHCR by digest. No tag is written until the
  # merge job has the digests of every platform
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # Registry repository names must be lowercase; github.repository is not
          echo "GHCR_IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same tag rules as the merge job so the version label baked into each
      # platform image matches the published tag
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=match,pattern=v(\d+\.\d+\.\d+)-alpine.*,group=1,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ragedunicorn/ffmpeg:smoke-${{ env.PLATFORM_PAIR }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=release-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      - name: Smoke test image
        env:
          IMAGE: ragedunicorn/ffmpeg:smoke-${{ env.PLATFORM_PAIR }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "::notice title=🧪 Smoke Test::Running FFmpeg natively on ${PLATFORM}..."

          echo "::group::Checking image platform"
          ACTUAL=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          echo "image platform: $ACTUAL"
          if [ "$ACTUAL" != "$PLATFORM" ]; then
            echo "::error title=❌ Wrong Platform::Image built for ${PLATFORM} reports ${ACTUAL}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::ffmpeg -version"
          if ! docker run --rm "$IMAGE" -version; then
            echo "::error title=❌ Smoke Test Failed::ffmpeg -version failed on ${PLATFORM}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Test encode (libx264 + libopus)"
          if ! docker run --rm "$IMAGE" -hide_banner -nostdin \
              -f lavfi -i testsrc=duration=1:size=128x72:rate=10 \
              -f lavfi -i sine=frequency=440:duration=1 \
              -c:v libx264 -c:a libopus -f null -; then
            echo "::error title=❌ Smoke Test Failed::Test encode failed on ${PLATFORM}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::notice title=✅ Smoke Test Passed::FFmpeg runs and encodes on ${PLATFORM}"
      # Same inputs as the smoke-test build, so this is a cache hit that only
      # exports and pushes the already-tested image
      - name: Push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha
            type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          # Attestation manifests are carried into the manifest list by the merge job
          sbom: true
          provenance: mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform digests into one manifest list and tag it on both
  # registries. The platform images only exist on GHCR (pushed by digest);
  # imagetools create copies them to Docker Hub while writing the tags there
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing (GitHub OIDC token for Fulcio)
      id-token: write
    steps:
      - name: Prepare
        run: |
          echo "GHCR_IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Install cosign
        uses: sigstore/cosign-installer@v4
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg
          tags: |
            # Strip 'v' prefix from git tag for Docker tag (e.g. X.Y.Z-alpineA.B.C-N)
            type=semver,pattern={{version}}
            # Also create FFmpeg version tag (e.g. X.Y.Z)
            type=match,pattern=v(\d+\.\d+\.\d+)-alpine.*,group=1,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
            # 'latest' tag for version tags (skipped for prereleases)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          echo "::group::Creating multi-platform manifest list"
          # Word splitting is intended: one -t flag per tag, one source per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)
          echo "::endgroup::"
      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            echo "::group::${image}:${VERSION}"
            docker buildx imagetools inspect "${image}:${VERSION}"
            echo "::endgroup::"
          done
      - name: Sign images with cosign
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg
        run: |
          # imagetools create writes the same manifest list to both registries,
          # so one digest identifies it on GHCR and Docker Hub
          DIGEST=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{ json .Manifest }}' | jq -r .digest)
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            echo "::group::Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
            echo "::endgroup::"
          done

  create-release:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: prev_tag
        run: |
          # Order by tag version, not by tagged commit, so a rebuild tag (-N bump)
          # sharing a commit with the previous release still resolves correctly
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fx -A1 "$GITHUB_REF_NAME" | sed -n 2p)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${{ steps.prev_tag.outputs.previous_tag }}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --reverse)
          fi

          # Create changelog
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS" | grep -E "^- (feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:" || echo "$COMMITS"
            echo ""
            echo "## Docker Image"
            echo ""
            echo "Pull the image:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg:${GITHUB_REF_NAME#v}"
            echo '```'
            echo ""
            echo "Or use the latest tag:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg:latest"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.previous_tag }}...${{ github.ref_name }}"
          } > CHANGELOG.md

          # Store for release body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
